# nnign – No News Is Good News (Nachrichtenmonitor für den VW-Konzern)
#
#   docker compose up -d --build      starten
#                                     Weboberfläche: http://localhost:<PORT>, wenn PORT in .env gesetzt ist
#   docker compose logs -f            Protokoll ansehen (enthält beim ersten Start das Admin-Passwort)
#   docker compose down               stoppen (Daten in ./data bleiben erhalten)
#
# Optionale Einstellungen in einer Datei .env neben dieser Datei (Vorlage: .env.example). Fehlt sie,
# startet nnign mit Standardwerten. Alle Variablen aus .env werden zusätzlich in den Container übernommen.
#
# Port: Nur wenn PORT in .env (oder der Shell) gesetzt ist, wird der Container nach außen veröffentlicht,
# z. B. PORT=8000 oder PORT=127.0.0.1:8000 (nur lokal). Ohne PORT ist nnign nur im Docker-Netz
# erreichbar (http://nnign:8000), etwa für einen Reverse-Proxy im selben Netz.
# Benötigt Docker Compose ab Version 2.24.
# Alle NNIGN_*-Werte lassen sich später auch im Admin-Bereich (/admin) ändern; dort gespeicherte
# Werte haben Vorrang vor diesen Umgebungsvariablen.

name: nnign

services:
  # Vorlagen für die Port-Freigabe (werden nie selbst gestartet). nnign erbt von „_intern“ oder –
  # wenn PORT gesetzt ist – von „_intern_published“.
  _intern:
    profiles: ["_vorlage"]
  _intern_published:
    profiles: ["_vorlage"]
    ports:
      - "${PORT:-8000}:8000"

  nnign:
    extends:
      service: _intern${PORT:+_published}
    profiles: !reset []
    build: .
    image: nnign:latest
    container_name: nnign
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data                                   # SQLite-Datenbank und admin_password.txt
    environment:
      # Zugangsdaten (API-Keys, Admin-Passwort) und Infrastruktur kommen aus .env (siehe .env.example);
      # alle übrigen Einstellungen nimmt der Admin im Web-UI unter /admin vor.
      TZ: ${TZ:-Europe/Berlin}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,libretranslate}
    extra_hosts:
      - "host.docker.internal:host-gateway"          # erreicht z. B. ein Ollama auf dem Docker-Host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optionaler, freier Übersetzungsserver (kein API-Key). Startet nur mit dem Profil „uebersetzung“;
  # nnign erkennt ihn automatisch unter http://libretranslate:5000.
  #   docker compose --profile uebersetzung up -d   (oder COMPOSE_PROFILES=uebersetzung in .env)
  # Der erste Start lädt die Sprachmodelle (einige 100 MB) und dauert einige Minuten.
  libretranslate:
    image: libretranslate/libretranslate:${LIBRETRANSLATE_TAG:-latest}
    container_name: nnign-libretranslate
    profiles: ["uebersetzung"]
    restart: unless-stopped
    environment:
      # Nur benötigte Sprachen laden. Startet der Container damit nicht, „en,de,zh“ versuchen.
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,de,zh-Hans}
      LT_UPDATE_MODELS: "true"
    volumes:
      - libretranslate-models:/home/libretranslate/.local   # Sprachmodelle bleiben über Neustarts erhalten
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  libretranslate-models:
